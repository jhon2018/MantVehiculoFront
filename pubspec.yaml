name: mantenimientovehiculos
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.0.0 <4.0.0" # Ajuste recomendado si estás en Flutter 3.8.x

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.6
  cupertino_icons: ^1.0.8
  go_router: ^13.0.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vehicle_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/loginFondo.png
    - assets/images/vehicle_icon.png
    - assets/icons/vehicle.png
    - assets/icons/driver.png
    - assets/icons/repair_detail.png
    - assets/icons/maintenance.png
    - assets/icons/supplier.png
    - assets/icons/repair_type.png
    - assets/icons/user.png
    - assets/icons/exit.png
    - assets/icons/Logo.png

